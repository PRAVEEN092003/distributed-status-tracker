{% extends "base.html" %}

{% block title %}{{ error_title }} - Distributed Status Tracker{% endblock %}

{% block content %}
<div class="placeholder-container">
    <div class="placeholder-card error-card">
        <div class="error-code-badge">{{ error_code }}</div>
        <h1 class="placeholder-title">{{ error_title }}</h1>
        <p class="placeholder-desc">{{ error_message }}</p>
        
        <div class="placeholder-actions">
            <a href="{{ url_for('dashboard') if current_user else url_for('login') }}" class="btn-primary">
                {{ 'Return to Dashboard' if current_user else 'Return to Login' }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
